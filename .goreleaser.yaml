version: 2

project_name: tf-slate

builds:
  - id: tf-slate
    main: ./cmd/tf-slate
    binary: tf-slate
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: tf-slate
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes and publishing stay in .github/workflows/release.yml.
changelog:
  disable: true
