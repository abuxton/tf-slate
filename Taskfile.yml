version: "3"

vars:
  BINARY_NAME: tf-slate
  BUILD_DIR: dist
  MAIN_PACKAGE: ./cmd/tf-slate

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  help:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  info:
    desc: Show local toolchain information
    cmds:
      - go version
      - git --version
      - task --version

  run:
    desc: Run tf-slate locally (pass flags with CLI_ARGS="...")
    cmds:
      - go run {{.MAIN_PACKAGE}} {{.CLI_ARGS}}

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build the tf-slate binary into dist/
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - 'go build -ldflags "-X main.version={{default "dev" .VERSION}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PACKAGE}}'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  dev:
    desc: Run the fast local development loop
    deps: [test, build]

  validate:
    desc: Run formatting, vetting, and tests
    deps: [fmt, vet, test]

  ci:
    desc: Run the local CI workflow
    deps: [validate, build]

  mod:download:
    desc: Download Go modules
    cmds:
      - go mod download

  mod:tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  mod:update:
    desc: Update Go module dependencies and tidy the module graph
    cmds:
      - go get -u ./...
      - go mod tidy

  skills:install:
    desc: Run npx skills experimental_install
    cmds:
      - npx skills experimental_install

  release:prepare:
    desc: Cut a release branch, update CHANGELOG.md, and open a PR (VERSION=x.y.z or vx.y.z, DRY_RUN=true for preview)
    deps: [validate]
    requires:
      vars: [VERSION]
    vars:
      NORMALIZED_VERSION:
        sh: |
          version="{{.VERSION}}"
          case "$version" in
            v*) printf "%s" "$version" ;;
            *) printf "v%s" "$version" ;;
          esac
    preconditions:
      - sh: echo "{{.NORMALIZED_VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
        msg: VERSION must be a semantic version like 0.1.0 or v0.1.0
      - sh: '[ "{{.DRY_RUN}}" = "true" ] || test -z "$(git status --porcelain)"'
        msg: Working tree must be clean before preparing a release
      - sh: '[ "{{.DRY_RUN}}" = "true" ] || command -v gh >/dev/null 2>&1'
        msg: gh CLI is required (https://cli.github.com)
    cmds:
      - |
        set -euo pipefail
        VERSION="{{.NORMALIZED_VERSION}}"
        BRANCH="release/${VERSION}"
        DATE=$(date +%Y-%m-%d)

        echo "==> Preparing release ${VERSION} on branch ${BRANCH}"

        # Ensure we are up-to-date with origin/main
        git fetch origin main

        # Collect commits since the last tag (fall back to full history)
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
        if [ -n "${PREV_TAG}" ]; then
          LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..origin/main")
        else
          LOG=$(git log --pretty=format:"- %s (%h)" origin/main)
        fi

        if [ -z "${LOG}" ]; then
          LOG="- No commits since the previous release"
        fi

        # Build the new CHANGELOG entry
        ENTRY="## [${VERSION}] - ${DATE}\n\n${LOG}\n"

        # Build PR body from the changelog entry
        PR_BODY=$(printf "## Release %s\n\nThis PR was created by \`task release:prepare\`.\n\nMerging this PR will trigger the release workflow, which will:\n- Create annotated git tag \`%s\`\n- Publish a GitHub Release with generated release notes\n\n### Changelog\n\n%s" "${VERSION}" "${VERSION}" "${LOG}")

        if [ "{{.DRY_RUN}}" = "true" ]; then
          echo "DRY_RUN: no local or remote changes will be made"
          echo "--- changelog entry preview ---"
          printf "%b\n" "${ENTRY}"
          echo "DRY_RUN: would create PR from ${BRANCH} → main with title 'Release ${VERSION}'"
          echo "--- PR body ---"
          printf "%s\n" "${PR_BODY}"
        else
          # Create release branch from origin/main.
          git checkout -B "${BRANCH}" origin/main

          changelog_tmp=$(mktemp CHANGELOG.md.tmp.XXXXXX)
          trap 'rm -f "${changelog_tmp}"' EXIT

          # Prepend the entry into CHANGELOG.md (after the header/comment block).
          # Falls back to inserting before the first existing release entry or
          # appending to the end of the file when no anchor exists.
          if [ -f CHANGELOG.md ]; then
            awk -v entry="${ENTRY}" '
              /^<!-- New release entries/ { print; print ""; print entry; inserted=1; next }
              /^## \[/ && !inserted { print entry; print ""; inserted=1 }
              { print }
              END { if (!inserted) { print ""; print entry } }
            ' CHANGELOG.md > "${changelog_tmp}"
          else
            printf "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n%b\n" "${ENTRY}" > "${changelog_tmp}"
          fi

          mv "${changelog_tmp}" CHANGELOG.md
          trap - EXIT

          git add CHANGELOG.md
          git commit -m "chore: release ${VERSION}" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push --force-with-lease origin "${BRANCH}"

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body "${PR_BODY}" \
            --label "release"
        fi

  release:tag:
    desc: Create and push a semver git tag directly (VERSION=x.y.z or vx.y.z, DRY_RUN=true for preview). Low-level escape hatch — prefer the release:prepare + PR workflow instead.
    deps: [validate]
    requires:
      vars: [VERSION]
    vars:
      NORMALIZED_VERSION:
        sh: |
          version="{{.VERSION}}"
          case "$version" in
            v*) printf "%s" "$version" ;;
            *) printf "v%s" "$version" ;;
          esac
    preconditions:
      - sh: echo "{{.NORMALIZED_VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
        msg: VERSION must be a semantic version like 0.1.0 or v0.1.0
      - sh: '[ "{{.DRY_RUN}}" = "true" ] || test -z "$(git status --porcelain)"'
        msg: Working tree must be clean before creating a release tag unless DRY_RUN=true
    cmds:
      - echo "Tagging release {{.NORMALIZED_VERSION}}"
      - |
        if [ "{{.DRY_RUN}}" = "true" ]; then
          task build VERSION={{.NORMALIZED_VERSION}}
          echo "DRY_RUN: would create annotated tag {{.NORMALIZED_VERSION}}"
          echo "DRY_RUN: would push tag {{.NORMALIZED_VERSION}} to origin"
        else
          task build VERSION={{.NORMALIZED_VERSION}}
          git tag -a "{{.NORMALIZED_VERSION}}" -m "Release {{.NORMALIZED_VERSION}}"
          git push origin "{{.NORMALIZED_VERSION}}"
        fi
